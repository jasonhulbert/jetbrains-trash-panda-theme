# Theme configuration file
# This file defines all available theme variants and their data files

themes:
  - name: default
    data_file: default.yaml
    description: "The original Trash Panda theme"

  - name: default-2026
    data_file: default-2026.yaml
    description: "Updated default theme for 2026"

  - name: starlight
    data_file: starlight.yaml
    description: "A starlit variation with cosmic blues"

  - name: moonlight
    data_file: moonlight.yaml
    description: "A softer moonlit variation"

  - name: dawnlight
    data_file: dawnlight.yaml
    description: "A warm dawn-inspired variation"

  - name: daylight
    data_file: daylight.yaml
    description: "A brighter daylight variation"

  - name: blacklight
    data_file: blacklight.yaml
    description: "A high-contrast blacklight variation"

targets:
  jetbrains:
    enabled: true
    templates:
      - template: theme.tmpl
        output_key: theme_out_file
      - template: scheme.tmpl
        output_key: scheme_out_file
    output_dir: src/main/resources/META-INF

  vscode:
    enabled: true
    templates:
      - template: vscode.tmpl
        output_suffix: "-color-theme.json"
    output_dir: dist/vscode/themes

  warp:
    enabled: true
    templates:
      - template: warp.tmpl
        output_suffix: ".yaml"
    output_dir: dist/warp

  obsidian:
    enabled: true
    templates:
      - template: obsidian.tmpl
        output_suffix: ".css"
    output_dir: dist/obsidian
